<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4d3a">
<title>Three Roll Backgammon</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f4efe5;--ink:#27251f;--muted:#6e695f;--board:#c99a62;--dark:#71452f;--light:#ead8b8;--accent:#1f4d3a;--white:#faf7ef;--black:#252525}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}
main{max-width:650px;margin:auto;padding:16px 12px 32px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.title{font-size:20px;font-weight:800}.small{font-size:13px;color:var(--muted)}
.card{background:#fff8;border:1px solid #0002;border-radius:14px;padding:12px;margin:12px 0}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{min-height:44px;border:0;border-radius:10px;padding:0 14px;font-size:16px;font-weight:700;background:var(--accent);color:white}button.secondary{background:#ded8cb;color:var(--ink)}button:disabled{opacity:.4}
.dice{display:flex;gap:6px}.die{width:42px;height:42px;border:1px solid #0003;background:white;border-radius:9px;display:grid;place-items:center;font-size:20px;font-weight:800}
.board{background:var(--board);padding:6px;border-radius:12px;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:180px 180px;gap:3px;overflow:hidden}
.point{position:relative;border:1px solid #0002;border-radius:3px;background:var(--light);padding:2px;min-width:0;display:flex;justify-content:center;align-items:flex-start}
.point:nth-child(odd){background:var(--dark)}.point.bottom{align-items:flex-end}.point.sel{outline:4px solid var(--accent);outline-offset:-4px}.point.legal{box-shadow:inset 0 0 0 4px #3c8d68}
.stack{display:flex;flex-direction:column;gap:1px;align-items:center}.bottom .stack{flex-direction:column-reverse}
.checker{width:clamp(20px,6.5vw,30px);height:clamp(20px,6.5vw,30px);border-radius:50%;border:2px solid #0005;display:grid;place-items:center;font-size:10px;font-weight:800}
.w{background:var(--white);color:#111}.b{background:var(--black);color:#fff}.num{position:absolute;right:2px;top:1px;font-size:9px;opacity:.55}.bottom .num{top:auto;bottom:1px}
.break{display:none;text-align:center;padding:18px}.break.show{display:block}.break h2{margin:0 0 6px}
.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{font-size:13px;background:#fff8;border:1px solid #0002;padding:5px 8px;border-radius:99px}
@media(max-width:380px){main{padding-left:7px;padding-right:7px}.board{grid-template-rows:165px 165px}}
</style>
</head>
<body>
<main>
 <div class="top"><div><div class="title">Three Roll Backgammon</div><div class="small">A tiny break, not a time sink. · v3</div></div><div id="counter" class="pill">0 / 3 turns</div></div>
 <section id="play">
  <div class="card">
   <div id="status"><b>Your turn.</b> Roll the dice.</div>
   <div class="controls" style="margin-top:10px">
    <div id="dice" class="dice"></div>
    <button id="roll">Roll</button>
   </div>
  </div>
  <div class="stats">
   <span class="pill">You off: <b id="woff">0</b></span><span class="pill">Computer off: <b id="boff">0</b></span>
   <span class="pill">Bar: you <b id="wbar">0</b> · computer <b id="bbar">0</b></span>
  </div>
  <div id="board" class="board" style="margin-top:10px"></div>
  <div class="small" id="hint" style="margin-top:8px">Tap Roll to start. Then tap a checker and a highlighted point.</div>
 </section>
 <section id="break" class="card break">
   <h2>Break complete.</h2>
   <p>You took 3 turns. Your game is saved on this device.</p>
   <button id="later">Done for now</button>
   <button id="another" class="secondary" style="margin-top:8px">Start another 3-turn break</button>
 </section>
 <div class="controls" style="margin-top:14px"><button id="new" class="secondary">New game</button></div>
</main>
<script>
(()=>{
const KEY='three-roll-backgammon-v1';
let s;
const fresh=()=>({p:Array(24).fill(0),bar:{W:0,B:0},off:{W:0,B:0},turn:'W',dice:[],selected:null,session:0,paused:false,over:false});
function setup(x){x.p[23]=2;x.p[12]=5;x.p[7]=3;x.p[5]=5;x.p[0]=-2;x.p[11]=-5;x.p[16]=-3;x.p[18]=-5;return x}
function load(){try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){} if(!s||!Array.isArray(s.p))s=setup(fresh())}
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
const $=q=>document.querySelector(q), board=$('#board'), diceEl=$('#dice');
function owner(v){return v>0?'W':v<0?'B':null}
function bear(pl){if(s.bar[pl])return false;if(pl==='W'){for(let i=6;i<24;i++)if(s.p[i]>0)return false}else{for(let i=0;i<18;i++)if(s.p[i]<0)return false}return true}
function dest(pl,from,d){let to=pl==='W'?from-d:from+d;if(from===24)to=pl==='W'?24-d:d-1;if(to>=0&&to<24){let v=s.p[to];return (pl==='W'?v>=-1:v<=1)?[to]:[]}if(bear(pl)&&((pl==='W'&&to<0)||(pl==='B'&&to>23)))return [pl==='W'?-1:24];return []}
function legal(pl){let a=[], sources=s.bar[pl]?[24]:[...Array(24).keys()].filter(i=>owner(s.p[i])===pl);for(let from of sources)for(let d of s.dice)for(let to of dest(pl,from,d))a.push({from,to,d});return a}
function consume(d){let i=s.dice.indexOf(d);if(i>=0)s.dice.splice(i,1)}
function move(pl,m){if(m.from===24)s.bar[pl]--;else s.p[m.from]+=pl==='W'?-1:1;if(m.to<0||m.to>23)s.off[pl]++;else{if(pl==='W'&&s.p[m.to]===-1){s.p[m.to]=0;s.bar.B++}if(pl==='B'&&s.p[m.to]===1){s.p[m.to]=0;s.bar.W++}s.p[m.to]+=pl==='W'?1:-1}consume(m.d);s.selected=null;if(s.off[pl]>=15){s.over=true;s.dice=[]}save();render()}
function roll(){let a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);s.dice=a===b?[a,a,a,a]:[a,b];save()}
function endTurn(){if(s.over)return;if(s.turn==='W'){s.session++;if(s.session>=3){s.paused=true;s.dice=[];save();render();return}}s.turn=s.turn==='W'?'B':'W';s.selected=null;s.dice=[];save();render();if(s.turn==='B')setTimeout(ai,400)}
function ai(){if(s.over||s.turn!=='B')return;roll();render();const step=()=>{let a=legal('B');if(!s.dice.length||!a.length){s.dice=[];save();setTimeout(endTurn,250);return}a.sort((x,y)=>score(y)-score(x));move('B',a[0]);if(!s.over&&s.turn==='B'&&s.dice.length)setTimeout(step,220);else if(!s.over&&s.turn==='B')setTimeout(endTurn,220)};setTimeout(step,250)}
function score(m){return (m.to===24?100:0)+(m.to>=0&&s.p[m.to]===1?25:0)+(m.to-m.from)}
function order(){return [...Array(12).keys()].map(i=>i+12).concat([...Array(12).keys()].map(i=>11-i))}
function render(){
 $('#counter').textContent=Math.min(s.session,3)+' / 3 turns';$('#woff').textContent=s.off.W;$('#boff').textContent=s.off.B;$('#wbar').textContent=s.bar.W;$('#bbar').textContent=s.bar.B;
 diceEl.innerHTML='';s.dice.forEach(d=>{let e=document.createElement('div');e.className='die';e.textContent=d;diceEl.appendChild(e)});
 $('#play').style.display=s.paused?'none':'block';$('#break').classList.toggle('show',s.paused);
 let status=s.over?(s.off.W>=15?'You won the game!':'Computer won the game.'):(s.turn==='W'?(s.dice.length?'Your move.':'Your turn. Roll the dice.'):'Computer is moving…');$('#status').innerHTML='<b>'+status+'</b>';
 $('#roll').disabled=s.over||s.turn!=='W'||s.dice.length>0||s.paused;
 board.innerHTML='';let lm=s.turn==='W'?legal('W'):[];let tos=s.selected===null?[]:lm.filter(m=>m.from===s.selected).map(m=>m.to);
 order().forEach((idx,k)=>{let e=document.createElement('button');e.type='button';e.className='point '+(k>=12?'bottom ':'')+(s.selected===idx?'sel ':'')+(tos.includes(idx)?'legal ':'');let n=document.createElement('span');n.className='num';n.textContent=idx+1;e.appendChild(n);let st=document.createElement('span');st.className='stack';let ct=Math.abs(s.p[idx]);for(let j=0;j<Math.min(ct,5);j++){let c=document.createElement('span');c.className='checker '+(s.p[idx]>0?'w':'b');if(j===Math.min(ct,5)-1&&ct>5)c.textContent=ct;st.appendChild(c)}e.appendChild(st);e.addEventListener('click',()=>tap(idx));board.appendChild(e)});
 if(s.turn==='W'&&s.dice.length&&!lm.length)setTimeout(()=>{s.dice=[];save();endTurn()},250);
 save()
}
function tap(idx){if(s.turn!=='W'||!s.dice.length||s.paused||s.over)return;let lm=legal('W');if(s.selected!==null){let a=lm.filter(m=>m.from===s.selected&&m.to===idx);if(a.length){move('W',a[0]);if(!s.dice.length||!legal('W').length)setTimeout(endTurn,220);return}}if(s.p[idx]>0&&lm.some(m=>m.from===idx)){s.selected=idx;render()}}
$('#roll').addEventListener('click',()=>{roll();render();if(s.bar.W){let a=legal('W');if(a.length){move('W',a[0]);if(!s.dice.length||!legal('W').length)setTimeout(endTurn,220)}else setTimeout(endTurn,250)}});
$('#another').addEventListener('click',()=>{s.paused=false;s.session=0;s.turn='W';save();render()});
$('#later').addEventListener('click',()=>{$('#break').querySelector('p').textContent='Saved. Close this whenever you want. Your game will be here next time.'});
$('#new').addEventListener('click',()=>{if(confirm('Start a new game? Your current game will be replaced.')){s=setup(fresh());save();render()}});
load();render();if(s.turn==='B'&&!s.paused&&!s.over)setTimeout(ai,350);
})();
</script>
</body>
</html>
